  <rect x="420" y="490" width="1500" height="18" fill="#141d2e" stroke="#334155" stroke-width="2"/>
  <line x1="420" y1="452" x2="1920" y2="452" stroke="#334155" stroke-width="2"/>
  <!-- Floodlight Tower Right -->
  <line x1="1460" y1="780" x2="1460" y2="380" stroke="#475569" stroke-width="6"/>
  <rect x="1428" y="362" width="64" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
