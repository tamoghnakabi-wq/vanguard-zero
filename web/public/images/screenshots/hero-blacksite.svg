  <rect x="640" y="620" width="320" height="140" fill="#111a28" stroke="#334155" stroke-width="2"/>
  <path d="M675 620V760M715 620V760M755 620V760M795 620V760M835 620V760M875 620V760M915 620V760" stroke="#1e293b" stroke-width="3"/>
