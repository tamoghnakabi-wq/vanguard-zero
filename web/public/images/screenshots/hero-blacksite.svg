<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="45%" stop-color="#0f1b2e"/>
      <stop offset="78%" stop-color="#172438"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="floodWarm" cx="72%" cy="54%" r="36%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
