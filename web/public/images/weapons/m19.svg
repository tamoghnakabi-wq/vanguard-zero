<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#13222b"/>
      <stop offset="60%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <!-- M19 Tactical Sidearm Silhouette -->
  <g transform="translate(360, 170)">
    <!-- Machined Slide -->
    <path d="M75 68H445L458 118H75V68Z" fill="url(#slide)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Tritium Iron Sights -->
    <rect x="88" y="56" width="18" height="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="420" y="56" width="14" height="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- Slide Serrations -->
    <path d="M115 76V110M130 76V110M145 76V110M160 76V110M375 76V110M390 76V110M405 76V110" stroke="#475569" stroke-width="3"/>
    <!-- Threaded Barrel Tip -->
    <rect x="454" y="82" width="38" height="24" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Frame + Underbarrel Rail -->
    <path d="M88 118H446V148H270L246 188H186L164 148H88V118Z" fill="#171f2e" stroke="#64748b" stroke-width="2"/>
    <!-- Underbarrel Laser Module -->
    <rect x="330" y="148" width="110" height="36" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="430" cy="166" r="5" fill="#38bdf8"/>
    <!-- Tactical Grip -->
    <path d="M98 148H186L146 312H56L98 148Z" fill="#111827" stroke="#64748b" stroke-width="2"/>
    <!-- Magazine Baseplate -->
    <path d="M52 312H150L144 334H46L52 312Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <rect x="120" y="535" width="960" height="1.5" fill="url(#cyanLine)"/>
  <text x="80" y="76" fill="#38bdf8" font-family="monospace" font-size="16" letter-spacing="4">ARMORY TELEMETRY // STUDIO RENDER SLOT</text>
  <text x="80" y="608" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="28" letter-spacing="4">M19 TACTICAL SIDEARM</text>
  <text x="1120" y="608" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="16" letter-spacing="2">9×19MM PARABELLUM // TRITIUM</text>
</svg>
