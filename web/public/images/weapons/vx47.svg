<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#152236"/>
      <stop offset="60%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <!-- VX-47 Tactical Carbine Technical Silhouette -->
  <g transform="translate(150, 195)">
    <!-- Suppressor / Muzzle brake -->
    <rect x="760" y="96" width="128" height="24" rx="3" fill="url(#metal)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M845 96V120M860 96V120M875 96V120" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Quad-rail Handguard -->
    <rect x="495" y="88" width="265" height="44" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="515" y="98" width="42" height="10" rx="2" fill="#090d14"/>
    <rect x="572" y="98" width="42" height="10" rx="2" fill="#090d14"/>
    <rect x="629" y="98" width="42" height="10" rx="2" fill="#090d14"/>
    <rect x="686" y="98" width="42" height="10" rx="2" fill="#090d14"/>
    <!-- Angled Foregrip -->
    <path d="M565 132H650L625 164H580L565 132Z" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <!-- Upper & Lower Receiver -->
    <path d="M265 82H495V148H430L418 168H315L295 148H265V82Z" fill="url(#metal)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Holographic Sight -->
    <path d="M355 44H442L452 82H345L355 44Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="368" y="54" width="60" height="18" rx="2" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
    <circle cx="398" cy="63" r="3" fill="#f59e0b"/>
    <!-- Curved Magazine -->
    <path d="M402 148H462L484 268L428 278L402 148Z" fill="#171f2e" stroke="#64748b" stroke-width="2"/>
    <!-- Pistol Grip -->
    <path d="M312 148H352L334 242H292L312 148Z" fill="#111827" stroke="#475569" stroke-width="2"/>
    <!-- Skeletal Collapsible Stock -->
    <path d="M62 84H265V118H210L110 170H62V84Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <path d="M90 104H180L112 142H90V104Z" fill="#090d14"/>
  </g>
  <rect x="120" y="535" width="960" height="1.5" fill="url(#accent)"/>
  <text x="80" y="76" fill="#38bdf8" font-family="monospace" font-size="16" letter-spacing="4">ARMORY TELEMETRY // STUDIO RENDER SLOT</text>
  <text x="80" y="608" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="28" letter-spacing="4">VX-47 ASSAULT RIFLE</text>
  <text x="1120" y="608" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="16" letter-spacing="2">5.56×45MM NATO // 720 RPM</text>
</svg>
